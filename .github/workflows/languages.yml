name: Languages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"

permissions:
  contents: write

concurrency:
  group: languages
  cancel-in-progress: false

jobs:
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Generate language statistics
        uses: lowlighter/metrics@latest
        with:
          # Authentication
          token: ${{ secrets.GH_PAT }}
          committer_token: ${{ github.token }}
          user: ZnqbuZ

          # Output
          filename: languages.svg
          output_action: commit
          base: ""

          # Repository discovery
          repositories: 500
          repositories_batch: 100
          repositories_forks: yes
          repositories_affiliations: >-
            owner, collaborator, organization_member

          # Commit attribution
          commits_authoring: ZnqbuZ

          # Language statistics
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: >-
            most-used, recently-used

          # Display
          plugin_languages_limit: 8
          plugin_languages_other: yes
          plugin_languages_details: >-
            percentage, lines, bytes-size

          # Include all language categories
          plugin_languages_categories: >-
            data, markup, programming, prose
          plugin_languages_recent_categories: >-
            data, markup, programming, prose

          # Maximum recent activity window
          plugin_languages_recent_load: 1000
          plugin_languages_recent_days: 365

          # Maximum analysis timeouts (minutes)
          plugin_languages_analysis_timeout: 60
          plugin_languages_analysis_timeout_repositories: 15
