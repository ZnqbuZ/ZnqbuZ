name: Languages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 0"

permissions:
  contents: write

concurrency:
  group: profile-summary-cards
  cancel-in-progress: false

jobs:
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        with:
          USERNAME: ZnqbuZ
          BRANCH_NAME: main
          TIME_ZONE: Europe/Paris
          THEME: github
          EXCLUDE: ""
          EXCLUDE_REPOS: ""
          AUTO_PUSH: true
